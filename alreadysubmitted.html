<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Already Submitted - Class 6 Concept</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #e3f2fd,
                #f5f7fa
            );
        }

        .container {
            width: 90%;
            max-width: 500px;

            background: white;

            padding: 40px 30px;

            border-radius: 18px;

            text-align: center;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.12);
        }

        .icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #e8f5e9;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 42px;

            color: #2e7d32;
        }

        h1 {
            margin: 10px 0 15px;

            font-size: 28px;

            color: #222;
        }

        .exam-name {
            font-size: 20px;

            font-weight: bold;

            color: #1976d2;

            margin-bottom: 20px;
        }

        p {
            font-size: 17px;

            line-height: 1.6;

            color: #555;

            margin: 8px 0;
        }

        .message {
            margin-top: 20px;

            padding: 15px;

            border-radius: 10px;

            background: #f5f5f5;

            color: #444;

            font-size: 16px;
        }

        .footer {
            margin-top: 25px;

            font-size: 13px;

            color: #888;
        }

    </style>

</head>


<body>

    <div class="container">

        <div class="icon">
            ✓
        </div>

        <h1>Already Submitted</h1>

        <div class="exam-name">
            Class 6 Concept Examination
        </div>

        <p>
            Your examination has already been submitted.
        </p>

        <div class="message">

            You cannot attempt this examination again.

            <br><br>

            Your submitted result has been recorded.

        </div>

        <div class="footer">
            Himalaya Public School<br>
            Nawabpet Branch
        </div>

    </div>

</body>

</html>

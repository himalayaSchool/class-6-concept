<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Himalaya School - Student Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:linear-gradient(145deg,#eef4ff,#f7f9fc);color:#172033}
.card{width:100%;max-width:420px;padding:32px;border-radius:28px;background:rgba(255,255,255,.96);box-shadow:0 20px 60px rgba(25,50,100,.15);border:1px solid rgba(20,40,80,.08)}
.header{text-align:center;margin-bottom:28px}
.logo{width:64px;height:64px;margin:0 auto 15px;display:flex;align-items:center;justify-content:center;border-radius:18px;background:#172b5c;color:#fff;font-size:28px;font-weight:800}
h1{margin:0;font-size:26px;letter-spacing:-.5px}.subtitle{margin:7px 0 0;color:#697386;font-size:14px}
label{display:block;margin:18px 0 8px;font-size:13px;font-weight:700}
input{width:100%;padding:15px;border:1px solid #d7ddea;border-radius:14px;background:#fff;font-size:16px;outline:none}
input:focus{border-color:#4778ff;box-shadow:0 0 0 4px rgba(71,120,255,.10)}
button{width:100%;margin-top:23px;padding:15px;border:0;border-radius:14px;background:#172b5c;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.message{display:none;margin-top:16px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.4}
.message.error{display:block;background:#fff0f0;color:#b42318}.message.info{display:block;background:#eef4ff;color:#24458c}
.footer{margin-top:20px;text-align:center;color:#8992a3;font-size:12px}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="logo">H</div>
    <h1>HIMALAYA</h1>
    <p class="subtitle">Student Examination Portal</p>
  </div>

  <form id="loginForm">
    <label for="admissionNumber">Admission Number</label>
    <input id="admissionNumber" type="text" autocomplete="username"
           placeholder="Enter Admission Number" required
           autocapitalize="characters">

    <label for="passcode">Passcode</label>
    <input id="passcode" type="password" autocomplete="current-password"
           placeholder="Enter Passcode" required>

    <button id="loginButton" type="submit">Login</button>
    <div id="message" class="message"></div>
  </form>

  <div class="footer">Secure Student Examination Login</div>
</div>

<script>
/* Student Data Google Sheet ID */
const STUDENT_DATA_SHEET_ID =
  "1KAI6rxRK9mckIJYJlQOP-xB8EIwFVvlYmRgpHpdWueE";

/* Paste the deployed Apps Script /exec URL here */
const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyVBK9BHdBozVZXe5bHBkcuUEqkLafFj0KETPdjVQeP0hRCUSxGACj1rpimzlqGEBSZ/exec";

/* One GitHub repository can contain all 12 test folders. */
const TEST_URLS = {
  "6 Concept": "https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/6-concept/",
  "7 Concept": "https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/7-concept/",
  "8 Concept": "https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/8-concept/",
  "9 Concept": "https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/9-concept/",
  "6 IIT": "https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/6-iit/",
  "7 IIT": "https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/7-iit/",
  "8 IIT": "https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/8-iit/",
  "9 IIT": "https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/9-iit/",
  "6 CO": "https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/6-co/",
  "7 CO": "https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/7-co/",
  "8 CO": "https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/8-co/",
  "9 CO": "https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/9-co/"
};

const ALREADY_SUBMITTED_PAGE = "already-submitted.html";

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

function showMessage(text, type) {
  message.textContent = text;
  message.className = "message " + type;
}

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  const admissionNumber = document.getElementById("admissionNumber")
    .value.trim().toUpperCase();

  const passcode = document.getElementById("passcode")
    .value.trim().toUpperCase();

  if (!admissionNumber || !passcode) {
    showMessage("Please enter your Admission Number and Passcode.", "error");
    return;
  }

  /* Admission Number is both Login ID and Passcode. */
  if (admissionNumber !== passcode) {
    showMessage("Invalid Admission Number or Passcode.", "error");
    return;
  }

  if (APPS_SCRIPT_URL.includes("PASTE_YOUR_APPS_SCRIPT")) {
    showMessage("The examination server is not connected yet.", "error");
    return;
  }

  button.disabled = true;
  button.textContent = "Checking...";
  showMessage("Verifying your details...", "info");

  try {
    const response = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify({
        action: "login",
        loginId: admissionNumber,
        password: passcode
      })
    });

    const result = await response.json();

    if (!result.success) {
      showMessage(result.message || "Invalid Admission Number.", "error");
      return;
    }

    if (result.submitted === true) {
      sessionStorage.setItem("studentName", result.studentName || "");
      sessionStorage.setItem("studentClass", result.studentClass || "");
      window.location.href = ALREADY_SUBMITTED_PAGE;
      return;
    }

    const studentClass = result.studentClass;

    if (!studentClass) {
      showMessage("Your class is not available in the student data.", "error");
      return;
    }

    const testURL = TEST_URLS[studentClass];

    if (!testURL || testURL.includes("YOUR-USERNAME")) {
      showMessage("The test page for " + studentClass +
                  " has not been configured yet.", "error");
      return;
    }

    sessionStorage.setItem("studentName", result.studentName || "");
    sessionStorage.setItem("studentClass", studentClass);
    sessionStorage.setItem("startTime", result.startTime || "");
    sessionStorage.setItem("endTime", result.endTime || "");

    window.location.href = testURL;

  } catch (error) {
    console.error(error);
    showMessage("Unable to connect to the examination server. Please try again.", "error");
  } finally {
    button.disabled = false;
    button.textContent = "Login";
  }
});
</script>
</body>
</html>

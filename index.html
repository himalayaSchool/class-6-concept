<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#172b5c"
>

<title>Himalaya School - Class 6 Concept</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    Arial,
    sans-serif;

  background:
    linear-gradient(
      145deg,
      #eef4ff,
      #f7f9fc
    );

  color:#172033;
}

.card{
  width:100%;
  max-width:420px;

  padding:32px;

  border-radius:28px;

  background:
    rgba(255,255,255,.97);

  box-shadow:
    0 20px 60px
    rgba(25,50,100,.15);

  border:
    1px solid
    rgba(20,40,80,.08);
}

.header{
  text-align:center;
  margin-bottom:28px;
}

.logo{
  width:64px;
  height:64px;

  margin:
    0 auto 15px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:18px;

  background:#172b5c;
  color:white;

  font-size:28px;
  font-weight:800;
}

h1{
  margin:0;

  font-size:26px;
  letter-spacing:-.5px;
}

.subtitle{
  margin:
    7px 0 12px;

  color:#697386;

  font-size:14px;
}

.exam{
  display:inline-block;

  padding:
    7px 13px;

  border-radius:20px;

  background:#eef4ff;

  color:#24458c;

  font-size:13px;
  font-weight:700;
}

label{
  display:block;

  margin:
    18px 0 8px;

  font-size:13px;
  font-weight:700;
}

input{
  width:100%;

  padding:15px;

  border:
    1px solid
    #d7ddea;

  border-radius:14px;

  background:white;

  font-size:16px;

  outline:none;
}

input:focus{
  border-color:#4778ff;

  box-shadow:
    0 0 0 4px
    rgba(71,120,255,.10);
}

button{
  width:100%;

  margin-top:23px;

  padding:15px;

  border:0;

  border-radius:14px;

  background:#172b5c;

  color:white;

  font-size:16px;
  font-weight:700;

  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;

  margin-top:16px;

  padding:
    12px 14px;

  border-radius:12px;

  font-size:14px;
  line-height:1.4;
}

.message.error{
  display:block;

  background:#fff0f0;

  color:#b42318;
}

.message.info{
  display:block;

  background:#eef4ff;

  color:#24458c;
}

.footer{
  margin-top:20px;

  text-align:center;

  color:#8992a3;

  font-size:12px;
}

/*
  Hidden iframe used for cross-origin
  Apps Script login.
*/

#loginFrame{
  display:none;
}

</style>

</head>


<body>


<div class="card">


  <div class="header">

    <div class="logo">
      H
    </div>

    <h1>
      HIMALAYA
    </h1>

    <p class="subtitle">
      Student Examination Portal
    </p>

    <div class="exam">
      CLASS 6 — CONCEPT
    </div>

  </div>


  <!--
    The form submits directly to Apps Script.

    The response opens inside the hidden iframe.
    Apps Script then redirects the TOP window
    to the examination page.
  -->

  <form
    id="loginForm"
    method="GET"
    target="loginFrame"
  >

    <label for="admissionNumber">
      Admission Number
    </label>

    <input
      id="admissionNumber"
      name="admissionNumber"
      type="text"
      autocomplete="username"
      placeholder="Enter Admission Number"
      required
      autocapitalize="characters"
      spellcheck="false"
    >


    <label for="passcode">
      Passcode
    </label>

    <input
      id="passcode"
      name="password"
      type="password"
      autocomplete="current-password"
      placeholder="Enter Passcode"
      required
    >


    <input
      type="hidden"
      name="action"
      value="login"
    >


    <button
      id="loginButton"
      type="submit"
    >
      Login
    </button>


    <div
      id="message"
      class="message"
    ></div>

  </form>


  <iframe
    id="loginFrame"
    name="loginFrame"
  ></iframe>


  <div class="footer">
    Secure Student Examination Login
  </div>


</div>


<script>

/* =====================================================
   APPS SCRIPT
   ===================================================== */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyVBK9BHdBozVZXe5bHBkcuUEqkLafFj0KETPdjVQeP0hRCUSxGACj1rpimzlqGEBSZ/exec";


/* =====================================================
   ELEMENTS
   ===================================================== */

const form =
  document.getElementById(
    "loginForm"
  );

const button =
  document.getElementById(
    "loginButton"
  );

const message =
  document.getElementById(
    "message"
  );

const admissionInput =
  document.getElementById(
    "admissionNumber"
  );

const passcodeInput =
  document.getElementById(
    "passcode"
  );


/* =====================================================
   APPS SCRIPT URL
   ===================================================== */

form.action =
  APPS_SCRIPT_URL;


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(
  text,
  type
){

  message.textContent =
    text;

  message.className =
    "message " + type;

}


/* =====================================================
   LOGIN
   ===================================================== */

form.addEventListener(
  "submit",
  function(event){

    const admissionNumber =
      admissionInput.value
        .trim()
        .toUpperCase();

    const passcode =
      passcodeInput.value
        .trim()
        .toUpperCase();


    /*
      Client-side validation.
    */

    if(
      !admissionNumber ||
      !passcode
    ){

      event.preventDefault();

      showMessage(
        "Please enter your Admission Number and Passcode.",
        "error"
      );

      return;

    }


    /*
      Admission number is the passcode.
    */

    if(
      admissionNumber !==
      passcode
    ){

      event.preventDefault();

      showMessage(
        "Invalid Admission Number or Passcode.",
        "error"
      );

      return;

    }


    /*
      Store temporary information.
      The Apps Script will independently
      verify the student.
    */

    sessionStorage.setItem(
      "admissionNumber",
      admissionNumber
    );


    /*
      Show loading state.

      DO NOT preventDefault.

      The form must actually submit
      to Apps Script.
    */

    button.disabled =
      true;

    button.textContent =
      "Checking...";


    showMessage(
      "Verifying your details...",
      "info"
    );

  }
);


/* =====================================================
   UPPERCASE ADMISSION NUMBER
   ===================================================== */

admissionInput.addEventListener(
  "input",
  function(){

    this.value =
      this.value.toUpperCase();

  }
);

</script>


</body>

</html>

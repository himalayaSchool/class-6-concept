<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#172b5c"
>

<title>Himalaya School - Class 6 Concept</title>


<style>

/* =====================================================
   RESET
   ===================================================== */

*{
  box-sizing:border-box;
}


/* =====================================================
   BODY
   ===================================================== */

body{

  margin:0;

  min-height:100vh;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:20px;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    Arial,
    sans-serif;

  background:
    linear-gradient(
      145deg,
      #eef4ff,
      #f7f9fc
    );

  color:#172033;

}


/* =====================================================
   LOGIN CARD
   ===================================================== */

.card{

  width:100%;

  max-width:560px;

  padding:42px;

  border-radius:30px;

  background:
    rgba(255,255,255,.98);

  box-shadow:
    0 20px 60px
    rgba(25,50,100,.15);

  border:
    1px solid
    rgba(20,40,80,.08);

}


/* =====================================================
   HEADER
   ===================================================== */

.header{

  text-align:center;

  margin-bottom:34px;

}


.logo{

  width:76px;

  height:76px;

  margin:
    0 auto 18px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:20px;

  background:#172b5c;

  color:white;

  font-size:36px;

  font-weight:800;

}


h1{

  margin:0;

  font-size:34px;

  letter-spacing:-.8px;

}


.subtitle{

  margin:
    8px 0 15px;

  color:#697386;

  font-size:17px;

}


.exam{

  display:inline-block;

  padding:
    9px 17px;

  border-radius:22px;

  background:#eef4ff;

  color:#24458c;

  font-size:14px;

  font-weight:800;

}


/* =====================================================
   FORM
   ===================================================== */

label{

  display:block;

  margin:
    20px 0 9px;

  font-size:15px;

  font-weight:700;

}


input{

  width:100%;

  padding:17px;

  border:
    1px solid
    #d7ddea;

  border-radius:15px;

  background:white;

  color:#172033;

  font-size:17px;

  outline:none;

}


input:focus{

  border-color:#4778ff;

  box-shadow:
    0 0 0 4px
    rgba(71,120,255,.10);

}


input:disabled{

  background:#eef1f6;

}


/* =====================================================
   LOGIN BUTTON
   ===================================================== */

button{

  width:100%;

  margin-top:26px;

  padding:17px;

  border:0;

  border-radius:15px;

  background:#172b5c;

  color:white;

  font-size:17px;

  font-weight:800;

  cursor:pointer;

  transition:
    opacity .2s,
    transform .1s;

}


button:hover{

  opacity:.94;

}


button:active{

  transform:scale(.99);

}


button:disabled{

  opacity:.6;

  cursor:not-allowed;

}


/* =====================================================
   MESSAGE
   ===================================================== */

.message{

  display:none;

  margin-top:17px;

  padding:
    14px 16px;

  border-radius:13px;

  font-size:14px;

  line-height:1.5;

}


.message.error{

  display:block;

  background:#fff0f0;

  color:#b42318;

}


.message.info{

  display:block;

  background:#eef4ff;

  color:#24458c;

}


/* =====================================================
   FOOTER
   ===================================================== */

.footer{

  margin-top:26px;

  text-align:center;

  color:#8992a3;

  font-size:13px;

}


/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:600px){

  body{

    padding:14px;

  }


  .card{

    padding:28px 22px;

    border-radius:24px;

  }


  .logo{

    width:64px;

    height:64px;

    font-size:30px;

  }


  h1{

    font-size:29px;

  }


  .subtitle{

    font-size:15px;

  }


  input{

    padding:15px;

    font-size:16px;

  }


  button{

    padding:15px;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     LOGIN CARD
     ===================================================== -->

<div class="card">


  <!-- ===================================================
       HEADER
       =================================================== -->

  <div class="header">


    <div class="logo">
      H
    </div>


    <h1>
      HIMALAYA
    </h1>


    <div class="subtitle">
      Student Examination Portal
    </div>


    <div class="exam">
      CLASS 6 — CONCEPT
    </div>


  </div>


  <!-- ===================================================
       LOGIN FORM
       =================================================== -->

  <form
    id="loginForm"
    method="GET"
  >


    <!-- ADMISSION NUMBER -->

    <label
      for="admissionNumber"
    >
      Admission Number
    </label>


    <input
      id="admissionNumber"
      name="admissionNumber"
      type="text"
      autocomplete="username"
      placeholder="Enter Admission Number"
      required
      autocapitalize="characters"
      spellcheck="false"
    >


    <!-- PASSCODE -->

    <label
      for="passcode"
    >
      Passcode
    </label>


    <input
      id="passcode"
      name="password"
      type="password"
      autocomplete="current-password"
      placeholder="Enter Passcode"
      required
    >


    <!-- ACTION -->

    <input
      type="hidden"
      name="action"
      value="login"
    >


    <!-- LOGIN BUTTON -->

    <button
      id="loginButton"
      type="submit"
    >
      Login
    </button>


    <!-- MESSAGE -->

    <div
      id="message"
      class="message"
    ></div>


  </form>


  <!-- FOOTER -->

  <div class="footer">
    Secure Student Examination Login
  </div>


</div>



<script>

/* =====================================================
   GOOGLE APPS SCRIPT WEB APP
   ===================================================== */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyVBK9BHdBozVZXe5bHBkcuUEqkLafFj0KETPdjVQeP0hRCUSxGACj1rpimzlqGEBSZ/exec";


/* =====================================================
   ELEMENTS
   ===================================================== */

const form =
  document.getElementById(
    "loginForm"
  );


const button =
  document.getElementById(
    "loginButton"
  );


const message =
  document.getElementById(
    "message"
  );


const admissionInput =
  document.getElementById(
    "admissionNumber"
  );


const passcodeInput =
  document.getElementById(
    "passcode"
  );


/* =====================================================
   APPS SCRIPT FORM ACTION
   ===================================================== */

form.action =
  APPS_SCRIPT_URL;


/* =====================================================
   SHOW MESSAGE
   ===================================================== */

function showMessage(
  text,
  type
){

  message.textContent =
    text;

  message.className =
    "message " +
    type;

}


/* =====================================================
   ADMISSION NUMBER
   ALWAYS UPPERCASE
   ===================================================== */

admissionInput.addEventListener(
  "input",
  function(){

    this.value =
      this.value.toUpperCase();

  }
);


/* =====================================================
   LOGIN SUBMISSION
   ===================================================== */

form.addEventListener(
  "submit",
  function(event){

    const admissionNumber =
      admissionInput.value
        .trim()
        .toUpperCase();


    const passcode =
      passcodeInput.value
        .trim()
        .toUpperCase();


    /* -----------------------------------------------
       CHECK EMPTY FIELDS
       ----------------------------------------------- */

    if(
      !admissionNumber ||
      !passcode
    ){

      event.preventDefault();

      showMessage(
        "Please enter your Admission Number and Passcode.",
        "error"
      );

      return;

    }


    /* -----------------------------------------------
       CURRENT SYSTEM:
       ADMISSION NUMBER = PASSCODE
       ----------------------------------------------- */

    if(
      admissionNumber !==
      passcode
    ){

      event.preventDefault();

      showMessage(
        "Invalid Admission Number or Passcode.",
        "error"
      );

      return;

    }


    /* -----------------------------------------------
       SAVE ADMISSION NUMBER LOCALLY
       ----------------------------------------------- */

    sessionStorage.setItem(
      "admissionNumber",
      admissionNumber
    );


    /* -----------------------------------------------
       IMPORTANT:
       DO NOT USE event.preventDefault() HERE.
       
       The browser must submit the form directly
       to the Apps Script Web App.
       ----------------------------------------------- */

    button.disabled =
      true;


    button.textContent =
      "Checking...";


    admissionInput.disabled =
      true;


    passcodeInput.disabled =
      true;


    showMessage(
      "Verifying your details...",
      "info"
    );

  }
);

</script>


</body>

</html>
